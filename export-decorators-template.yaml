spec:
  owner: default/engineering
  type: service

  parameters:
    type: object
    required:
      - entityRef
      - repoUrl
    properties:
      entityRef:
        title: Entity Reference
        type: string
        description: Backstage entityRef (kind:namespace/name)
      repoUrl:
        title: Catalog Repository URL
        type: string
        description: Git URL of the catalog repo (HTTPS)

  steps:
    - id: fetchDecorations
      name: Get Decorators
      action: http:backstage:request
      input:
        method: GET
        path: '/proxy/roadie/fragments?entityRef=${{ parameters.entityRef }}'

    - id: mergeYaml
      name: Merge into catalog-info.yaml
      action: roadiehq:utils:merge
      input:
        path: ./catalog-info.yaml
        content: ${{ steps.fetchDecorations.output.body.items[0].fragment }}
        preserveYamlComments: true

    - id: createPullRequest
      name: Create Pull Request
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: 'roadie-sync-${{ randomString(6) }}'
        title: 'Sync Roadie Decorators for ${{ parameters.entityRef }}'
        description: |
          This PR merges the latest Decorator metadata for ${{ parameters.entityRef }}.
